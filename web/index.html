<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8B1C3E">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Apply online to become a Student Assistant at Marinduque State University. Create an account, upload your documents and track your application with SAIS.">
  <link rel="canonical" href="https://sais-6168b.web.app/">

  <!-- Link previews (Facebook, Messenger, and the like read these tags and do
       not run the app, so they are plain HTML here). The image is 1200x630. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SAIS">
  <meta property="og:title" content="Become a Student Assistant at MarSU">
  <meta property="og:description" content="Apply online, upload your documents and track your application. Work on campus and earn while you learn.">
  <meta property="og:url" content="https://sais-6168b.web.app/">
  <meta property="og:image" content="https://sais-6168b.web.app/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="SAIS, Marinduque State University: Work on campus. Earn while you learn.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Become a Student Assistant at MarSU">
  <meta name="twitter:description" content="Apply online, upload your documents and track your application.">
  <meta name="twitter:image" content="https://sais-6168b.web.app/og-image.png">
  <!-- Google Sign-In web client ID -->
  <meta name="google-signin-client_id" content="478525793741-4gdecf12ssq9eu2p0dh9saj1i14uh6ec.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SAIS">
  <!-- iOS fills transparency with black, so use the full-bleed icon. -->
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SAIS · Apply as a Student Assistant | Marinduque State University</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Shown while the app downloads and starts; removed on its first frame. */
    html, body { margin: 0; height: 100%; background: #f8fafc; }
    #sais-splash {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px;
      font: 500 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #475569; text-align: center; padding: 24px;
    }
    #sais-splash .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid #e2e8f0; border-top-color: #8b1c3e;
      animation: sais-spin 0.9s linear infinite;
    }
    @keyframes sais-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #sais-splash .spinner { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <div id="sais-splash" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div id="sais-splash-text">Loading SAIS&hellip;</div>
    <noscript>SAIS needs JavaScript. Please turn it on and reload.</noscript>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('sais-splash');
      var slow = setTimeout(function () {
        var text = document.getElementById('sais-splash-text');
        if (text) {
          text.textContent =
            'This is taking longer than usual. Check your connection, then reload.';
        }
      }, 20000);
      window.addEventListener('flutter-first-frame', function () {
        clearTimeout(slow);
        if (splash) splash.remove();
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
