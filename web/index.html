  <style>
    /* The start-up loader: shown while the app downloads and starts, faded out
       on its first frame. The page behind it is maroon too, so nothing white
       flashes before it or between it and the first screen. */
    html, body { margin: 0; height: 100%; background: #5a1027; }
    #sais-splash {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center;
      background: #5a1027; color: #fff; text-align: center; padding: 24px;
      font: 500 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.35s ease;
    }
    #sais-splash.leaving { opacity: 0; pointer-events: none; }
    #sais-splash .seal {
      position: relative; width: 116px; height: 116px;
      display: grid; place-items: center;
      animation: sais-arrive 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    #sais-splash .seal .disc {
      position: absolute; width: 100px; height: 100px; border-radius: 50%;
      background: #fffaf0;
    }
    #sais-splash .seal img {
      position: relative; width: 88px; height: 88px; border-radius: 50%;
    }
    #sais-splash .seal .ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.18);
    }
    #sais-splash .seal .arc {
      position: absolute; inset: 0; border-radius: 50%;
      border: 3px solid transparent; border-top-color: #f3e6cf;
      animation: sais-orbit 1.1s linear infinite;
    }
    #sais-splash .word {
      margin-top: 26px; font-size: 30px; font-weight: 800;
      letter-spacing: 0.14em; padding-left: 0.14em;
    }
    #sais-splash .sub {
      margin-top: 6px; font-size: 11.5px; font-weight: 600;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
    }
    #sais-splash .bar {
      margin-top: 28px; width: 148px; height: 3px; overflow: hidden;
      background: rgba(255, 255, 255, 0.18); border-radius: 2px;
    }
    #sais-splash .bar i {
      display: block; width: 100%; height: 100%; background: #f3e6cf;
      animation: sais-sweep 1.5s ease-in-out infinite;
    }
    #sais-splash-text {
      margin-top: 16px; font-size: 13px; color: rgba(255, 255, 255, 0.82);
    }
    @keyframes sais-orbit { to { transform: rotate(360deg); } }
    @keyframes sais-sweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    @keyframes sais-arrive {
      from { opacity: 0; transform: scale(0.86); }
      to { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #sais-splash .seal, #sais-splash .seal .arc, #sais-splash .bar i {
        animation: none;
      }
      #sais-splash .seal .arc { display: none; }
      #sais-splash .seal .ring { border-color: #f3e6cf; }
      #sais-splash .bar i { width: 40%; }
    }
  </style>

<body>
  <div id="sais-splash">
    <div class="seal" aria-hidden="true">
      <span class="disc"></span>
      <img src="icons/Icon-192.png" alt="" width="88" height="88">
      <span class="ring"></span>
      <span class="arc"></span>
    </div>
    <div class="word" aria-hidden="true">SAIS</div>
    <div class="sub" aria-hidden="true">Student Assistant Information System</div>
    <div class="bar" aria-hidden="true"><i></i></div>
    <div id="sais-splash-text" role="status" aria-live="polite">Loading SAIS&hellip;</div>
    <noscript>SAIS needs JavaScript. Please turn it on and reload.</noscript>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('sais-splash');
      var started = Date.now();
      var done = false;
      // Not the network alone: this covers the app's engine and its services
      // starting too, so it only says the start-up is still going.
      var slow = setTimeout(function () {
        var text = document.getElementById('sais-splash-text');
        if (text) {
          text.textContent =
            'SAIS is still starting. You can keep waiting or reload the page.';
        }
      }, 20000);

      function remove() {
        if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
      }

      function dismiss() {
        if (done) return;
        done = true;
        clearTimeout(slow);
        if (!splash) return;
        var reduced = window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) {
          remove();
          return;
        }
        splash.classList.add('leaving');
        splash.addEventListener('transitionend', function (e) {
          if (e.target === splash && e.propertyName === 'opacity') remove();
        });
        // A hidden tab or a disabled transition never reports the end.
        setTimeout(remove, 500);
      }

      // Seen for at least a moment, even when the app starts from the cache,
      // so the start always looks the same instead of flickering.
      window.addEventListener('flutter-first-frame', function () {
        setTimeout(dismiss, Math.max(0, 700 - (Date.now() - started)));
      }, { once: true });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.

    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
